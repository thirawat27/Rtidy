# One-time clean-up requested by the repo owner: remove the v0.2.0 release and its tag.
name: delete-release
on:
  push:
    branches: [main]
    paths: [.github/workflows/delete-release.yml]
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete release v0.2.0 and tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete v0.2.0 --cleanup-tag --yes 2>&1 | tee result.txt || true
          git ls-remote --tags "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}" >> result.txt
          echo "releases left:" >> result.txt
          gh release list >> result.txt 2>&1 || true
          cat result.txt
      - name: Report to ci-logs
        run: |
          git clone -q --depth 1 --branch ci-logs "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" logs
          cp result.txt logs/delete-release.txt
          cd logs && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "delete-release result" && git push -q
