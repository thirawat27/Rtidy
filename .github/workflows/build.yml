name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default; the two jobs that need more say so themselves.
permissions:
  contents: read

# A new push to a pull request makes the running build pointless: cancel it, so it
# cannot finish and upload a set of artifacts nobody will ever download. Tag builds are
# never cancelled — that one is cutting a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-22.04 # older glibc = runs on more distros
            name: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      # Every branch writing its own cache fills the repository's 10 GB cache quota with
      # near-identical copies, and GitHub then evicts the one that actually gets reused.
      # Pull requests restore the cache and save nothing; main and tags keep it current.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.name }}
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Version
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [[ "$GITHUB_REF" == refs/tags/v* ]] && v="${GITHUB_REF_NAME#v}"
          echo "RTIDY_VERSION=$v" >> "$GITHUB_ENV"
          mkdir -p logs dist

      - name: Test
        run: |
          set -o pipefail
          cargo test 2>&1 | tee logs/test.log

      - name: Build (Windows, Linux)
        if: matrix.name != 'macos'
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee logs/build.log

      - name: Build (macOS universal)
        if: matrix.name == 'macos'
        run: |
          set -o pipefail
          cargo build --release --target aarch64-apple-darwin 2>&1 | tee logs/build.log
          cargo build --release --target x86_64-apple-darwin 2>&1 | tee -a logs/build.log
          mkdir -p target/release
          lipo -create -output target/release/rtidy \
            target/aarch64-apple-darwin/release/rtidy target/x86_64-apple-darwin/release/rtidy

      - name: CLI smoke test
        run: |
          set -o pipefail
          exe=target/release/rtidy
          [[ "${{ matrix.name }}" == windows ]] && exe=target/release/rtidy.exe
          mkdir -p smoke/p/target/debug && echo '[package]' > smoke/p/Cargo.toml
          touch smoke/p/target/CACHEDIR.TAG && head -c 100000 /dev/urandom > smoke/p/target/debug/x
          {
            "$exe" --version
            "$exe" scan smoke
            "$exe" clean smoke --days 0 --dry-run
            "$exe" doctor smoke
          } 2>&1 | tee logs/smoke.log

      - name: Package (Windows installer)
        if: matrix.name == 'windows'
        run: |
          set -o pipefail
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -f "$ISCC" ] || choco install innosetup -y --no-progress
          "$ISCC" packaging/windows/rtidy.iss 2>&1 | tee logs/package.log
          cp target/release/rtidy.exe dist/rtidy-windows-x64-portable.exe

      - name: Package (macOS dmg)
        if: matrix.name == 'macos'
        run: |
          set -o pipefail
          bash packaging/macos/bundle.sh target/release/rtidy "$RTIDY_VERSION" 2>&1 | tee logs/package.log

      - name: Package (Linux deb, AppImage, tar.gz)
        if: matrix.name == 'linux'
        run: |
          set -o pipefail
          bash packaging/linux/package.sh target/release/rtidy "$RTIDY_VERSION" 2>&1 | tee logs/package.log

      - name: Record result
        if: always()
        run: |
          echo "${{ matrix.name }}: ${{ job.status }} @ ${GITHUB_SHA::7}" > logs/STATUS
          ls -la dist >> logs/STATUS 2>&1 || true

      # Artifacts are the only thing here that outlives the runner, and they are charged
      # to the account's storage until they expire — at the default retention of 90 days
      # that is every push and every pull request, kept for three months. Logs are text
      # and stay a week; the installers stay a fortnight, which is long enough to grab a
      # build from Actions and short enough that they do not accumulate. On a pull
      # request both go after a day: the point there is that the build passed.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.name }}
          path: logs/
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 7 }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 14 }}
          # The payload is already compressed (exe, dmg, deb, AppImage, tar.gz); zipping
          # it again costs minutes and saves nothing.
          compression-level: 0

  release:
    needs: build
    # Only when you push a v* tag yourself; normal pushes never create a release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the GitHub release
      actions: write # and clears the artifacts it has just made redundant
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      # The installers now live on the release page, where they are not charged to the
      # storage quota and are not going to expire. Keeping a second copy as a build
      # artifact costs the quota for nothing, so this run's `dist-*` go immediately.
      # The `logs-*` stay until their retention runs out: a release that turns out to be
      # broken is exactly when somebody wants the build log.
      - name: Drop the dist artifacts now they are on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("dist-")) | .id')
          for id in $ids; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" && echo "deleted artifact $id"
          done

  # crates.io is published from the same v* tag that cuts the GitHub release, so the
  # two can never drift apart. Needs a CARGO_REGISTRY_TOKEN repository secret; without
  # one the step says so and passes, rather than failing everybody else's release.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    # The same image the Linux build uses. `cargo publish` verifies by compiling, and
    # that includes the GUI feature, so it has to be an environment known to build it.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
          save-if: false # the build job owns this cache; publish only reads it

      - name: Tag must match Cargo.toml
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$v" != "$tag" ]; then
            echo "::error::tag v$tag does not match version $v in Cargo.toml"
            exit 1
          fi
          echo "publishing rtidy $v"

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set, skipping crates.io."
            echo "Add it under Settings -> Secrets and variables -> Actions."
            exit 0
          fi
          # Re-running a tag's workflow should not fail just because the version is
          # already up; crates.io versions cannot be replaced.
          if curl -fsS -H 'User-Agent: rtidy-ci' \
               "https://crates.io/api/v1/crates/rtidy/$v" >/dev/null 2>&1; then
            echo "rtidy $v is already on crates.io, nothing to do"
            exit 0
          fi
          cargo publish
