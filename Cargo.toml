[package]
name = "rtidy"
version = "0.1.0"
edition = "2021"
description = "Find, clean and prevent scattered Rust target/ directories"

[dependencies]
clap = { version = "4", features = ["derive"] }
walkdir = "2"
toml_edit = "0.22"
dirs = "5"
anyhow = "1"
rayon = "1.12.0"
humantime = "2.4.0"
fs4 = "1.1.0"

[profile.release]
strip = true
lto = true
