[package]
name = "rtidy"
version = "1.1.0"
edition = "2024"
# The oldest toolchain rtidy is known to build on, checked by compiling against it
# rather than inferred from the language features it happens to use. Raising this
# locks people out of `cargo install` for no gain, so it stays as low as is verified.
rust-version = "1.99"
authors = ["Thirawat Sinlapasomsak (https://github.com/thirawat27)"]
description = "Find, clean and prevent scattered Rust target/ directories"
license = "GPL-3.0-only"
repository = "https://github.com/thirawat27/Rtidy"
readme = "README.md"
keywords = ["cargo", "target", "disk", "cleanup", "build"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]
# Screenshots and the oversized logo are for the README on GitHub; nothing here is
# needed to build, so they stay out of the published crate.
exclude = [
    "assets/showcase/*",
    "assets/logo-1024.png",
    "assets/logo.svg",
    ".github/*",
]

[features]
default = ["gui"]
# The desktop app. It brings in eframe, which is most of rtidy's dependency tree and
# needs X11/Wayland development headers on Linux, so
# `cargo install rtidy --no-default-features` gives a light CLI-only build that
# compiles anywhere.
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
clap = { version = "4", features = ["derive"] }
walkdir = "2"
toml_edit = "0.25"
dirs = "7"
anyhow = "1"
rayon = "1.12.0"
humantime = "2.4.0"
fs4 = "1.1.0"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
rfd = { version = "0.18.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
sys-locale = "0.3.2"

[profile.release]
strip = true
lto = true
# One codegen unit lets LLVM inline across the whole crate: a smaller binary, and
# the walk-and-stat loops that dominate every scan optimise better.
codegen-units = 1
# Unwinding is kept on purpose: a panic in a rayon worker mid-delete should unwind and
# be reported, not abort the process partway through a clean-up.
panic = "unwind"

# rtidy's own advice, applied to rtidy: dependencies build without debug info, so this
# project's own share of the shared target dir stays small and its links stay fast.
[profile.dev.package."*"]
debug = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
